[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bonsai-xiv"
version = "0.1.0"
description = "A decision tool for what is actually worth hoarding in FFXIV"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Arkhelyi"},
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "shellcheck-py>=0.11.0.1",
]
ui = [
    "marimo>=0.25.2",
]

[project.scripts]
bonsai = "bonsai.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bonsai"]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
